<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <!-- Link to our stylesheet (controls how the page looks) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Expense Tracker</h1>
      <p class="subtitle">Keep track of where your money goes.</p>
    </header>

    <!-- Total spent -->
    <section class="card total-card">
      <span class="total-label">Total spent</span>
      <span id="total" class="total-amount">$0.00</span>
    </section>

    <!-- Form for adding a new expense -->
    <section class="card">
      <h2>Add an expense</h2>
      <form id="expense-form">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="e.g. Groceries" required>
        </div>

        <div class="field">
          <label for="amount">Amount</label>
          <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" required>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Gas">Gas</option>
            <option value="Housing">Housing</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Shopping">Shopping</option>
            <option value="Health">Health</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>

        <button type="submit" class="btn-primary">Add expense</button>
      </form>
    </section>

    <!-- Spending broken down by category -->
    <section class="card">
      <h2>Spending by category</h2>
      <!-- JavaScript fills this in with one bar per category -->
      <div id="category-summary"></div>
      <p id="category-empty" class="empty">Your category breakdown will appear here.</p>
    </section>

    <!-- Summary table: count and total for every category -->
    <section class="card">
      <h2>Category totals</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Category</th>
              <th class="right">Expenses</th>
              <th class="right">Total</th>
            </tr>
          </thead>
          <!-- JavaScript fills these in -->
          <tbody id="category-table"></tbody>
          <tfoot id="category-table-footer"></tfoot>
        </table>
      </div>
    </section>

    <!-- Table listing all expenses -->
    <section class="card">
      <h2>Your expenses</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Name</th>
              <th>Category</th>
              <th class="right">Amount</th>
              <th></th>
            </tr>
          </thead>
          <!-- JavaScript fills this in with one row per expense -->
          <tbody id="expense-list"></tbody>
        </table>
      </div>
      <p id="empty-message" class="empty">No expenses yet. Add your first one above.</p>
    </section>
  </main>

  <!-- Load our JavaScript last, so the HTML above already exists when it runs -->
  <script src="script.js"></script>
</body>
</html>
